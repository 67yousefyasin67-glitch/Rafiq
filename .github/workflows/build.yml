name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare project
        run: |
          mkdir -p www && cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          npx cap init "Rafiq" com.rafiq.muslim --web-dir=www
          npx cap add android
          if [ -f adhan.wav ]; then mkdir -p android/app/src/main/res/raw && cp adhan.wav android/app/src/main/res/raw/adhan.wav; fi
          cat > patch.js <<'EOF'
          const fs=require('fs');
          const f='android/app/src/main/AndroidManifest.xml';
          let x=fs.readFileSync(f,'utf8');
          for(const p of ['SCHEDULE_EXACT_ALARM','POST_NOTIFICATIONS','RECEIVE_BOOT_COMPLETED','VIBRATE']){
            if(!x.includes('android.permission.'+p))
              x=x.replace('</manifest>','<uses-permission android:name="android.permission.'+p+'" /></manifest>');
          }
          fs.writeFileSync(f,x);
          EOF
          node patch.js
          npx cap sync
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
